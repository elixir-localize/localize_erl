name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: "OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }}${{ matrix.lint && ' (lint)' || '' }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Localize needs OTP 27+'s built-in :json module, so 27 is the floor.
          # Elixir is required on the runner because localize is pulled through
          # rebar_mix.
          - otp: "27"
            elixir: "1.18"
          - otp: "28"
            elixir: "1.19"
          - otp: "29"
            elixir: "1.20.2"
            lint: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Erlang, Elixir and rebar3
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
          rebar3-version: "3"

      - name: Restore build cache
        uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: rebar3-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('rebar.config') }}
          restore-keys: |
            rebar3-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Compile
        run: rebar3 compile

      - name: Run tests
        run: rebar3 eunit

      - name: Restore PLT cache
        if: matrix.lint
        uses: actions/cache@v5
        with:
          path: _build/default/*_plt
          key: plt-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('rebar.config') }}
          restore-keys: |
            plt-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Run dialyzer
        if: matrix.lint
        run: rebar3 dialyzer
